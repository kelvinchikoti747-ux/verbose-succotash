name: Build and Deploy to ACK

on:
  push:
    branches:
      - main

env:
  REGION_ID: cn-hangzhou
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  NAMESPACE: namespace
  IMAGE: repo
  TAG: ${{ github.sha }}
  ACK_CLUSTER_ID: clusterID
  ACK_DEPLOYMENT_NAME: nginx-deployment

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ACR
        uses: aliyun/acr-login@v1
        with:
          region-id: ${{ env.REGION_ID }}
          access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ACCESS_KEY_SECRET }}

      - name: Build and push image to ACR
        run: |
          docker build \
            -t "${REGISTRY}/${NAMESPACE}/${IMAGE}:${TAG}" \
            .
          docker push \
            "${REGISTRY}/${NAMESPACE}/${IMAGE}:${TAG}"

      - name: Scan image in ACR
        uses: aliyun/acr-scan@v1
        with:
          region-id: ${{ env.REGION_ID }}

      - name: Configure Alibaba Cloud credentials
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ACCESS_KEY_SECRET }}
          region-id: ${{ env.REGION_ID }}

      - name: Install Alibaba Cloud CLI
        run: |
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o aliyun-cli.tgz
          tar -xzf aliyun-cli.tgz
          sudo mv aliyun /usr/local/bin/aliyun
          aliyun version

      - name: Get ACK kubeconfig
        run: |
          aliyun cs GET \
            --ClusterId "${ACK_CLUSTER_ID}" \
            --format yaml > kubeconfig.yaml

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          cp kubeconfig.yaml "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Update deployment image
        run: |
          kubectl set image deployment/"${ACK_DEPLOYMENT_NAME}" \
            "${IMAGE}"="${REGISTRY}/${NAMESPACE}/${IMAGE}:${TAG}"

      - name: Wait for deployment
        run: |
          kubectl rollout status \
            deployment/"${ACK_DEPLOYMENT_NAME}" \
            --timeout=180s
