# ============================================================
# USERS
# ============================================================

@app.post("/users")
def create_user(
    data: UserCreate,
    db: Session = Depends(get_db),
    admin=Depends(
        require_roles("admin")
    )
):

    allowed_roles = {
        "admin",
        "analyst",
        "pentester",
        "auditor"
    }

    if data.role not in allowed_roles:

        raise HTTPException(
            status_code=400,
            detail="Invalid role"
        )

    existing = db.scalar(
        select(User).where(
            User.email == data.email
        )
    )

    if existing:

        raise HTTPException(
            status_code=409,
            detail="User already exists"
        )

    user = User(
        email=data.email,
        password_hash=hash_password(
            data.password
        ),
        role=data.role,
        active=True
    )

    db.add(user)
    db.commit()
    db.refresh(user)

    audit(
        db,
        admin.id,
        "create_user",
        user.email,
        {
            "role": user.role
        }
    )

    return {
        "id": user.id,
        "email": user.email,
        "role": user.role
    }


