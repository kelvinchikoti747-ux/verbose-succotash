    )

    active = Column(
        Boolean,
        default=True
    )

    created_at = Column(
        DateTime(timezone=True),
        default=utcnow
    )


class Scope(Base):

    __tablename__ = "scopes"

    id = Column(
        Integer,
        primary_key=True
    )

    name = Column(
        String(255),
        nullable=False
    )

    target = Column(
        String(500),
        nullable=False
    )

    owner = Column(
        String(255),
        nullable=True
    )

    authorized = Column(
        Boolean,
        default=False,
        nullable=False
    )

    notes = Column(
        Text,
        nullable=True
    )

    created_at = Column(
        DateTime(timezone=True),
        default=utcnow
    )


class Asset(Base):

    __tablename__ = "assets"

    id = Column(
        Integer,
        primary_key=True
    )

    scope_id = Column(
        Integer,
        ForeignKey("scopes.id"),
