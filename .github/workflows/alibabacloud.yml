# ============================================================
# PASSIVE HTTP SECURITY ASSESSMENT
# ============================================================

SECURITY_HEADERS = {

    "strict-transport-security": {
        "severity": "high",
        "remediation": (
            "Enable HSTS for HTTPS services."
        )
    },

    "content-security-policy": {
        "severity": "medium",
        "remediation": (
            "Define a restrictive "
            "Content-Security-Policy."
        )
    },

    "x-content-type-options": {
        "severity": "low",
        "remediation": (
            "Set X-Content-Type-Options "
            "to nosniff."
        )
    },

    "x-frame-options": {
        "severity": "low",
        "remediation": (
            "Set X-Frame-Options or "
            "frame-ancestors in CSP."
        )
    },

    "referrer-policy": {
        "severity": "low",
        "remediation": (
            "Set an explicit Referrer-Policy."
        )
    }
}


def passive_http_test(url):

    parsed = urlparse(
        url
    )

    if parsed.scheme not in {
        "http",
        "https"
    }:

        raise ValueError(
            "Only HTTP/HTTPS URLs are allowed."
        )

    if not parsed.hostname:

        raise ValueError(
            "URL has no hostname."
        )

    with httpx.Client(
        timeout=10,
        follow_redirects=False
    ) as client:

        response = client.get(
            url
        )

    response_headers = {
        key.lower(): value
        for key, value
        in response.headers.items()
    }

    findings = []

    for header, config in SECURITY_HEADERS.items():

        if header not in response_headers:

            findings.append({

                "title":
                    f"Missing security header: {header}",

                "severity":
                    config["severity"],

                "description":
                    (
                        f"The endpoint did not "
                        f"return {header}."
                    ),

                "remediation":
                    config["remediation"]
            })

    if parsed.scheme == "http":

        findings.append({

            "title":
                "Unencrypted HTTP endpoint",

            "severity":
                "medium",

            "description":
                (
                    "The supplied endpoint "
                    "uses HTTP."
                ),

            "remediation":
                (
                    "Use HTTPS and redirect "
                    "HTTP traffic to HTTPS."
                )
        })

    return {
        "url": url,
        "status_code": response.status_code,
        "server":
            response.headers.get(
                "server"
            ),
        "findings": findings
    }


@app.post("/assess/passive-http")
def assess_http(
    data: HTTPAssessment,
    db: Session = Depends(get_db),
    user=Depends(
        require_roles(
            "admin",
            "analyst",
            "pentester"
        )
    )
):

    scope = db.get(
        Scope,
        data.scope_id
    )

    if not scope:

        raise HTTPException(
            status_code=404,
            detail="Scope not found"
        )

    if not scope.authorized:

        raise HTTPException(
            status_code=403,
            detail=(
                "This scope is not marked "
                "as authorized."
            )
        )

    # Basic scope check.
    if scope.target not in data.url:

        raise HTTPException(
            status_code=403,
            detail=(
                "Target is outside the "
                "registered scope."
            )
        )

    try:

        result = passive_http_test(
            data.url
        )

    except Exception as error:

        raise HTTPException(
            status_code=400,
            detail=str(error)
        )

    for finding in result["findings"]:

        db.add(
            Finding(
                scope_id=scope.id,
                title=finding["title"],
                severity=finding["severity"],
                description=finding["description"],
                remediation=finding["remediation"],
                status="open"
            )
        )

    db.commit()

    audit(
        db,
        user.id,
        "passive_http_assessment",
        data.url,
        {
            "findings":
                len(
                    result["findings"]
                )
        }
    )

    return result


# ============================================================
# SHA-256 EVIDENCE HASH
# ============================================================

@app.post("/evidence/sha256")
def hash_evidence(
    data: HashRequest,
    user=Depends(
        require_roles(
            "admin",
            "analyst",
            "pentester"
        )
    )
):

    file_path = Path(
        data.path
    ).resolve()

    if not file_path.is_file():

        raise HTTPException(
            status_code=404,
            detail="File not found"
        )

    digest = hashlib.sha256()

    try:

        with file_path.open(
            "rb"
        ) as file:

            while True:

                chunk = file.read(
                    1024 * 1024
                )

                if not chunk:
                    break

                digest.update(
                    chunk
                )

    except Exception as error:

        raise HTTPException(
            status_code=400,
            detail=str(error)
        )

    return {
        "file": str(file_path),
        "sha256":
            digest.hexdigest()
    }


