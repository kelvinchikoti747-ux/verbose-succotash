def create_initial_admin():

    db = SessionLocal()

    try:

        existing = db.scalar(
            select(User).where(
                User.email == ADMIN_EMAIL
            )
        )

        if existing:
            return

        admin = User(
            email=ADMIN_EMAIL,
            password_hash=hash_password(
                ADMIN_PASSWORD
            ),
            role="admin",
            active=True
        )

        db.add(admin)
        db.commit()

        print(
            "Initial admin created:"
        )

        print(
            f"Email: {ADMIN_EMAIL}"
        )

        print(
            "Change the default password immediately."
        )

    finally:

        db.close()


create_initial_admin()


